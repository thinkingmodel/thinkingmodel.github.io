<!-- Confirmation shown after any subscribe form succeeds -->
<div class="expedition-overlay" id="subscribe-success" aria-hidden="true">
    <div class="expedition-modal" role="dialog" aria-modal="true" aria-labelledby="expedition-title">
        <button class="expedition-modal__close" data-expedition-close aria-label="Close">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="expedition-modal__glyph" aria-hidden="true">✦</div>
        <h2 class="expedition-modal__title" id="expedition-title">You're on the expedition.</h2>
        <p class="expedition-modal__body">Thanks for joining. You'll hear from me at every new milestone, and no noise
            in between.</p>

        <button type="button" class="expedition-modal__btn" data-expedition-close>
            <span>Onwards</span>
        </button>
    </div>
</div>
