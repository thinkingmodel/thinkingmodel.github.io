<!-- Premium Subscribe Modal -->
<div class="subscribe-modal-overlay" id="subscribe-modal" aria-hidden="true">
    <div class="subscribe-modal-content">
        <button class="subscribe-modal-close" aria-label="Close modal">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="subscribe-modal-header">
            <h2 class="sub-modal-title">Join the Expedition</h2>
            <p class="sub-modal-desc">Subscribe for the latest on AI, astrophysics, philosophy, and psychology.</p>
        </div>

        <!-- Posts to FormSubmit; JS swaps in the /ajax/ endpoint so the page never navigates away -->
        <form id="subscribe-ajax-form" action="https://formsubmit.co/{{ site.formsubmit }}" method="post"
            data-subscribe novalidate>
            <input type="hidden" name="_subject" value="New subscriber: The Thinking Model">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="Signed up from" value="Header modal">

            <div class="sub-input-group">
                <input type="email" name="email" id="sub-ajax-email" class="sub-modal-input"
                    placeholder="Your email address" required data-cursor="text">
                <button type="submit" class="sub-modal-submit">Subscribe</button>
            </div>
            <!-- Anti-bot honeypot -->
            <div style="position: absolute; left: -5000px;" aria-hidden="true">
                <input type="text" name="_honey" tabindex="-1" value="">
            </div>

            <div class="sub-modal-message subscribe-msg" id="sub-ajax-msg" data-subscribe-msg role="status"
                aria-live="polite"></div>
        </form>
    </div>
</div>
