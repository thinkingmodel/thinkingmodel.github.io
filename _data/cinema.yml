# Films on the curated shelf, shown on /cinema.html.
#
# Mirrors _data/bookshelf.yml. `slug` is the Letterboxd film slug and does two
# jobs: the poster is /assets/img/films/{slug}.jpg and the card links to
# https://letterboxd.com/film/{slug}/. Keep it exact or both break.
#
# `note` is the one-line premise revealed on hover. One sentence, present
# tense, no spoilers past the first act.
#
# `strand` picks the accent colour and the filter chip. Five strands, mapped to
# the site palette in cinema.html so the wall stays inside one system:
#   power    quasar    #fbbf24  crime, money, empire, ambition
#   mind     nebula    #a78bfa  memory, identity, puzzle, obsession
#   longing  nova      #f472b6  love, desire, loneliness, grief
#   witness  pulsar    #2dd4bf  history, war, injustice, true story
#   dread    supernova #fb923c  horror, thriller, the slow turn of the screw
#
# Posters come from the Wikipedia infobox of each film, cropped to 2:3 at
# 420x630. Source list: https://letterboxd.com/abhinavwrites/list/abhinav-curated/

films:
