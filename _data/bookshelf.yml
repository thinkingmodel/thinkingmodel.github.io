# Books Abhinav has read, shown on /books.html under "Shelf".
#
# To add a book, append an entry. Only title, author, cover and note are
# required. `accent` tints the cover toward one of the site palette colours
# and defaults to the amber used across the Books page. `link` is optional
# and makes the whole card clickable.
#
# Accents follow the site tag colours, so the shelf stays in one system:
#   '#fbbf24' quasar  philosophy, myth
#   '#f472b6' aurora  literature, fiction
#   '#fb923c' horizon psychology, behaviour
#   '#2dd4bf' pulsar  astronomy, physics
#   '#a78bfa' nebula  machines, minds
#
# `note` is the one-line hover summary. Keep it to a single sentence that
# makes someone want to pick the book up.
#
# Covers come from Open Library. Grab one with:
#   https://openlibrary.org/search.json?title=...&author=...
# then take the edition's cover id and resize to 420x646.

books:
- title: Yayati
  author: V. S. Khandekar
  year: 1959
  cover: /assets/img/books/yayati.jpg
  accent: '#fbbf24'
  note: A king borrows his son's youth to keep chasing pleasure, and learns that desire
    only grows by being fed.
  link: /hedonism-to-stoicism-odysseus-and-yayati.html

- title: Norwegian Wood
  author: Haruki Murakami
  year: 1987
  cover: /assets/img/books/norwegian-wood.jpg
  accent: '#f472b6'
  note: A love story about grief, and the people you cannot save no matter how gently
    you hold them.
  link: /navigating-dissonance-unraveling-complex-relationships-in-norwegian-wood.html

- title: Crime and Punishment
  author: Fyodor Dostoevsky
  year: 1866
  cover: /assets/img/books/crime-punishment.jpg
  accent: '#fb923c'
  note: A student murders a pawnbroker to prove he is above morality, then spends the
    rest of the book being wrong.

- title: White Nights
  author: Fyodor Dostoevsky
  year: 1848
  cover: /assets/img/books/white-nights.jpg
  accent: '#f472b6'
  note: A lonely dreamer meets a woman on a bridge for four nights, and finds out what
    hope costs.

- title: The Metamorphosis
  author: Franz Kafka
  year: 1915
  cover: /assets/img/books/metamorphosis.jpg
  accent: '#fbbf24'
  note: A man wakes up as an insect, and the horror is not the change but how quickly
    his family adjusts to it.

- title: Meditations
  author: Marcus Aurelius
  year: 'c. 180'
  cover: /assets/img/books/meditations.jpg
  accent: '#fbbf24'
  note: The private notebook of a Roman emperor talking himself, every morning, out
    of being insufferable.

- title: The Laws of Human Nature
  author: Robert Greene
  year: 2018
  cover: /assets/img/books/laws-human-nature.jpg
  accent: '#fb923c'
  note: A field guide to why people behave as they do, including the parts of yourself
    you would rather not look at.

- title: A Brief History of Time
  author: Stephen Hawking
  year: 1988
  cover: /assets/img/books/brief-history.jpg
  accent: '#2dd4bf'
  note: The Big Bang, black holes and the shape of time, famously explained using exactly
    one equation.

- title: Cosmos
  author: Carl Sagan
  year: 1980
  cover: /assets/img/books/cosmos.jpg
  accent: '#2dd4bf'
  note: Sagan walks you from the first stars to the human brain, and makes being small
    feel like a privilege.

- title: Relativity
  author: Albert Einstein
  year: 1916
  cover: /assets/img/books/relativity.jpg
  accent: '#2dd4bf'
  note: Einstein explaining his own theory, in his own words, to readers he assumed
    were not physicists.

- title: The Hitchhiker's Guide to the Galaxy
  author: Douglas Adams
  year: 1979
  cover: /assets/img/books/hitchhikers.jpg
  accent: '#f472b6'
  note: Earth is demolished for a bypass on page one, and the story only gets funnier
    from there.

- title: Mrityunjaya
  author: Shivaji Sawant
  year: 1967
  cover: /assets/img/books/mrityunjaya.jpg
  accent: '#fbbf24'
  note: Karna tells his own story, and the Mahabharata's most loyal outsider finally
    gets to explain himself.

- title: Yugandhar
  author: Shivaji Sawant
  year: 1988
  cover: /assets/img/books/yugandhar.jpg
  accent: '#fbbf24'
  note: Krishna seen as a man rather than a god, told by the people who could never
    quite decide which he was.

- title: Bhagavad Gita
  author: Vyasa
  year: 'c. 200 BCE'
  cover: /assets/img/books/bhagavad-gita.jpg
  accent: '#fbbf24'
  note: A warrior refuses to fight, and gets a battlefield answer on duty that people
    have been arguing over ever since.

- title: Notes from Underground
  author: Fyodor Dostoevsky
  year: 1864
  cover: /assets/img/books/notes-underground.jpg
  accent: '#fb923c'
  note: A bitter civil servant explains at length why he is the way he is, and manages
    to indict you along the way.

- title: Sophie's World
  author: Jostein Gaarder
  year: 1991
  cover: /assets/img/books/sophies-world.jpg
  accent: '#fbbf24'
  note: A teenager starts receiving anonymous letters asking who she is, and accidentally
    inherits the whole history of philosophy.

- title: Thinking, Fast and Slow
  author: Daniel Kahneman
  year: 2011
  cover: /assets/img/books/thinking-fast.jpg
  accent: '#fb923c'
  note: Two systems run your mind, and the fast one is confidently wrong far more often
    than it feels.

- title: 12 Rules for Life
  author: Jordan B. Peterson
  year: 2018
  cover: /assets/img/books/12-rules.jpg
  accent: '#fb923c'
  note: Clean your room before you try to fix the world, plus eleven more rules argued
    with unusual seriousness.

- title: Sapiens
  author: Yuval Noah Harari
  year: 2011
  cover: /assets/img/books/sapiens.jpg
  accent: '#a78bfa'
  note: How a middling ape took over the planet by inventing stories that enough strangers
    agreed to believe.

- title: The Almanack of Naval Ravikant
  author: Eric Jorgenson
  year: 2020
  cover: /assets/img/books/almanack-naval.jpg
  accent: '#a78bfa'
  note: Collected thinking on wealth and happiness, built on the claim that both are
    skills rather than luck.

- title: The God Delusion
  author: Richard Dawkins
  year: 2006
  cover: /assets/img/books/god-delusion.jpg
  accent: '#a78bfa'
  note: Dawkins argues religion is not merely untrue but actively harmful, and softens
    exactly nothing.

- title: Why I Am an Atheist
  author: Bhagat Singh
  year: 1930
  cover: /assets/img/books/why-atheist.jpg
  accent: '#a78bfa'
  note: A twenty-three year old writes from a death cell explaining why he will not
    take comfort in God.

- title: Revolution 2020
  author: Chetan Bhagat
  year: 2011
  cover: /assets/img/books/revolution-2020.jpg
  accent: '#f472b6'
  note: Two friends from Varanasi want the same woman and opposite futures, one through
    the system and one around it.

- title: Five Point Someone
  author: Chetan Bhagat
  year: 2004
  cover: /assets/img/books/five-point-someone.jpg
  accent: '#f472b6'
  note: Three friends work out that surviving IIT and actually learning something are
    two entirely different projects.

- title: The Alchemist
  author: Paulo Coelho
  year: 1988
  cover: /assets/img/books/alchemist.jpg
  accent: '#f472b6'
  note: A shepherd walks to the pyramids chasing buried treasure, and discovers the
    walking was the point.

- title: Eleven Minutes
  author: Paulo Coelho
  year: 2003
  cover: /assets/img/books/eleven-minutes.jpg
  accent: '#f472b6'
  note: A young woman leaves Brazil for Geneva and sets out to work out where sex ends
    and love begins.

- title: The Winner Stands Alone
  author: Paulo Coelho
  year: 2008
  cover: /assets/img/books/winner-stands-alone.jpg
  accent: '#f472b6'
  note: Twenty four hours at Cannes, seen through a man who has mistaken obsession
    for love and ambition for meaning.

- title: The Subtle Art of Not Giving a F*ck
  author: Mark Manson
  year: 2016
  cover: /assets/img/books/subtle-art.jpg
  accent: '#fb923c'
  note: You get a limited supply of things to care about, so the skill is picking which
    problems are worth having.
